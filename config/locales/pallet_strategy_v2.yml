      lowest_cost: "This mode has the lowest estimated route and point handling cost at the current rates."
      savings: "Estimated saving: %{amount} RUB for the same manifest (route and point handling only)."
      box_eligible: "This manifest is eligible for box delivery"
      box_unavailable: "This manifest does not meet box delivery limits"
      quote_incomplete: "Quote details are incomplete. Costs cannot be compared yet."
      choose_zone: "Choose a receiving tariff zone and delivery date to compare box / pallet costs."
      try_mode: "Switch to %{mode} and revalidate"
      current: "Current mode: %{mode}"
      apply: "Apply recommendation and revalidate"
      mode: "Cargo type"
