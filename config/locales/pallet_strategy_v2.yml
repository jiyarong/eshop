      zone: "Receiving tariff zone"
      date: "Expected delivery date"
      point: "Drop-off point type"
      point_name: "Drop-off point name"
      comparison: "Box / pallet quote for the same manifest"
      scope: "Estimated route transport and point handling only (RUB). Sorting, storage and own transport are excluded. Round each box separately; each pallet bills at least 1900L. Revalidate after choosing a cargo type. Platform admission still applies."
      bill_l: "Billed litres"
      rate: "Route RUB/L"
      cost: "Route and point RUB"
      status: "Feasibility"
      unknown: "Quote unavailable"
      available: "Available"
      recommended: "Recommended: %{mode}"
      break_even: "Simplified single-pallet route break-even: %{volume} L; carton and point limits still apply."
      source: "Delivery %{date} · Tariff snapshot %{snapshot}"
      points:
        warehouse: "Warehouse"
        sorting_center: "Sorting centre"
        pvz: "Pickup point (PVZ)"
