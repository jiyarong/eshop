zh:
  notifications:
    title: 系统通知
    detail_title: 通知详情
    subtitle: 查看需要开发、运营和管理员关注的经营异常
    back: 返回通知列表
    unread_count: 未读 %{count}
    mark_read: 标记已读
    mark_unread: 标记未读
    mark_all_read: 全部标记已读
    delete: 删除
    open_event: 查看关联事件
    empty: 暂无通知
    filters:
      label: 通知筛选
      all: 全部
      unread: 未读
      read: 已读
    types:
      daily_summary: 每日经营异常汇总
      price_anomaly: 价格异常
      funnel_anomaly: 销售漏斗异常
    severity:
      warning: 预警
      critical: 严重
    daily_summary:
      title: "%{date} 经营异常汇总"
      body: "共 %{count} 项经营异常：价格异常 %{price_count} 项，销售漏斗异常 %{funnel_count} 项。查看详情了解相关 SKU、店铺及异常指标。"
    price_anomaly:
      title: SKU %{sku_code} 价格异常
      body: "店铺 %{store_name} 的 SKU %{sku_code} %{field} 从 %{before_price} RUB 调整为 %{after_price} RUB，涨幅 %{change_percent}%%，请检查俄罗斯与白俄罗斯的定价配置。"
      fields:
        marketing_price: 营销价
        price: 商品价
      batch_title: 店铺 %{store_name} 出现批量价格异常
      batch_body: "店铺 %{store_name} 在一次同步中有 %{sku_count} 个 SKU 同方向大幅涨价，中位涨幅 %{median_change_percent}%%，请立即检查地理位置促销和区域价格配置。"
    funnel_anomaly:
      title: SKU %{sku_code} 销售漏斗异常
      body: "店铺 %{store_name}：统计 %{from_date} 至 %{to_date}（已预留 2 天数据回填时间），这 3 天浏览 %{current_views}，此前 3 天 %{baseline_views}；下单 %{current_orders}，此前 3 天 %{baseline_orders}。下单下降 %{order_drop_percent}%%，浏览下降 %{view_drop_percent}%%。"
      batch_title: 店铺 %{store_name} 出现批量漏斗异常
      batch_body: "店铺 %{store_name} 在 %{from_date} 至 %{to_date} 有 %{sku_count} 个 SKU 出现销售漏斗明显下降（已预留 2 天数据回填时间），请检查价格、地理位置促销和商品可售状态。"
    flash:
      deleted: 通知已删除
      marked_all_read: 已全部标记为已读
    pagination:
      label: 通知分页
      previous: 上一页
      next: 下一页
      page: 第 %{page} / %{pages} 页

en:
  notifications:
    title: System notifications
    detail_title: Notification details
    subtitle: Review business anomalies for developers, operators, and administrators
    back: Back to notifications
    unread_count: "%{count} unread"
    mark_read: Mark as read
    mark_unread: Mark as unread
    mark_all_read: Mark all as read
    delete: Delete
    open_event: Open related event
    empty: No notifications
    filters:
      label: Notification filters
      all: All
      unread: Unread
      read: Read
    types:
      daily_summary: Daily business anomaly summary
      price_anomaly: Price anomaly
      funnel_anomaly: Sales funnel anomaly
    severity:
      warning: Warning
      critical: Critical
    daily_summary:
      title: "Business anomaly summary for %{date}"
      body: "%{count} anomalies: %{price_count} price anomalies and %{funnel_count} sales funnel anomalies. Open the details for affected SKUs, stores, and metrics."
    price_anomaly:
      title: Price anomaly for SKU %{sku_code}
      body: "Store %{store_name}: %{field} for SKU %{sku_code} changed from %{before_price} RUB to %{after_price} RUB, up %{change_percent}%%. Check Russia and Belarus pricing configuration."
      fields:
        marketing_price: marketing price
        price: product price
      batch_title: Batch price anomaly in %{store_name}
      batch_body: "Store %{store_name}: %{sku_count} SKUs increased sharply in one sync, with a median increase of %{median_change_percent}%%. Check geographic promotions and regional pricing now."
    funnel_anomaly:
      title: Sales funnel anomaly for SKU %{sku_code}
      body: "Store %{store_name}: from %{from_date} to %{to_date}, allowing 2 days for data backfill, views were %{current_views} versus %{baseline_views} in the preceding 3 days; orders were %{current_orders} versus %{baseline_orders}. Orders fell %{order_drop_percent}%% and views fell %{view_drop_percent}%%."
      batch_title: Batch sales funnel anomaly in %{store_name}
      batch_body: "Store %{store_name}: %{sku_count} SKUs show a sharp sales funnel decline from %{from_date} to %{to_date}, allowing 2 days for data backfill. Check pricing, geographic promotions, and product availability."
    flash:
      deleted: Notification deleted
      marked_all_read: All notifications marked as read
    pagination:
      label: Notification pagination
      previous: Previous page
      next: Next page
      page: Page %{page} of %{pages}

ru:
  notifications:
    title: Системные уведомления
    detail_title: Детали уведомления
    subtitle: Аномалии продаж для разработчиков, операторов и администраторов
    back: Назад к уведомлениям
    unread_count: "Непрочитано: %{count}"
    mark_read: Отметить прочитанным
    mark_unread: Отметить непрочитанным
    mark_all_read: Отметить всё прочитанным
    delete: Удалить
    open_event: Открыть связанное событие
    empty: Уведомлений нет
    filters:
      label: Фильтры уведомлений
      all: Все
      unread: Непрочитанные
      read: Прочитанные
    types:
      daily_summary: Ежедневная сводка аномалий
      price_anomaly: Аномалия цены
      funnel_anomaly: Аномалия воронки продаж
    severity:
      warning: Предупреждение
      critical: Критично
    daily_summary:
      title: "Сводка аномалий за %{date}"
      body: "Всего аномалий: %{count}, из них ценовых: %{price_count}, воронки продаж: %{funnel_count}. Откройте подробности для просмотра SKU, магазинов и показателей."
    price_anomaly:
      title: Аномалия цены SKU %{sku_code}
      body: "Магазин %{store_name}: %{field} SKU %{sku_code} изменена с %{before_price} RUB до %{after_price} RUB, рост %{change_percent}%%. Проверьте цены для России и Беларуси."
      fields:
        marketing_price: маркетинговая цена
        price: цена товара
      batch_title: Массовая аномалия цен в магазине %{store_name}
      batch_body: "Магазин %{store_name}: за одну синхронизацию резко выросли цены у %{sku_count} SKU, медианный рост %{median_change_percent}%%. Проверьте географические акции и региональные цены."
    funnel_anomaly:
      title: "SKU %{sku_code}: аномалия воронки продаж"
      body: "Магазин %{store_name}: с %{from_date} по %{to_date} (с учётом 2 дней на обновление данных) просмотры %{current_views} против %{baseline_views} за предыдущие 3 дня, заказы %{current_orders} против %{baseline_orders}; падение заказов %{order_drop_percent}%%, просмотров %{view_drop_percent}%%."
      batch_title: Массовая аномалия воронки в магазине %{store_name}
      batch_body: "Магазин %{store_name}: с %{from_date} по %{to_date} (с учётом 2 дней на обновление данных) аномальное падение воронки обнаружено у %{sku_count} SKU. Проверьте цены, географические акции и доступность товаров."
    flash:
      deleted: Уведомление удалено
      marked_all_read: Все уведомления отмечены прочитанными
    pagination:
      label: Пагинация уведомлений
      previous: Предыдущая
      next: Следующая
      page: Страница %{page} из %{pages}
