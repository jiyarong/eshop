en:
  delivery_workbench:
    title: Warehouse delivery workbench
    description: Choose products first, then select this week’s destination cluster.
      Determine and adjust quantities later while packing boxes or pallets.
    plans: Delivery plans
    new: New delivery plan
    step_demand: 01 · Plan delivery demand
    manifest: Delivery manifest
    demand_hint: Select SKUs first; quantities can be left blank until packing. Estimates
      and shortage suggestions are advisory. Adjust quantities later to suit available
      stock and loading capacity. Missing carton dimensions do not block planning.
    destination_hint: Choose a destination cluster based on operational needs. A cluster
      can receive stock even when it has no current shortage.
    plan_hint: Delivery plans do not reserve stock. Confirmed packing batches reserve
      stock.
    suggested_units: Suggested units
    sales: All-platform sales (units)
    sales_hint: "Last 4 weeks: %{from} to %{to}, across all stores and platforms, excluding cancelled and returned orders. Forecast uses the SKU workbench's strict daily forecast × 28 days; - means no valid observation days."
    recent_sales: "Last 4 weeks: %{quantity}"
    strict_forecast_sales: "Strict forecast × 28 days: %{quantity}"
    packable_units: Stock available for this batch
    units: Estimated units (optional)
    quantity_pending: Determine during packing
    week: Delivery week (week containing the selected date)
    save: Save delivery plan
    saved: Delivery plan saved
    packaging_ready: Carton data ready
    packaging_pending: Carton data pending; planning available
    packing_plans: Packing batches
    pack: 02 · Allocate boxes / pallets
    edit: Edit delivery plan
    cancel: Cancel delivery plan
    allocated: Total units in batches
    remaining: Estimated units remaining
    reference_units: Reference units to send
    source_plan: 'Delivery plan: %{number}'
    packing_hint: Estimates do not limit packing. Adjust quantities to suit stock,
      carton data and loading capacity. Suggested boxes use the remaining estimate,
      or sales when no estimate is set; coverage ranges guide automatic top-ups.
      Batch totals include drafts and completed batches, excluding cancelled batches.
      Check the total before packing another batch.
    empty: No delivery plans
    no_packing: No packing batches allocated
    statuses:
      active: Pending execution
      cancelled: Cancelled
    messages:
      saving: Saving delivery plan…
      failed: Save failed. Please retry.
  pallet_workbench:
    errors:
      delivery_inactive: This delivery plan is cancelled and cannot be edited or allocated.
      delivery_sku_unavailable: '%{sku} is not in this delivery plan. Add it to the plan first.'
      delivery_sku_in_use: '%{sku} is used in packing batches. Cancel those batches before removing it.'
      delivery_has_packages: Cancel the packing batches before cancelling this delivery
        plan.
ru:
  delivery_workbench:
    title: Рабочее место поставок
    description: Сначала выберите товары и целевой кластер на эту неделю.
      Количество можно определить и изменить позже при упаковке в коробки или на паллеты.
    plans: Планы поставок
    new: Новый план поставки
    step_demand: 01 · Планирование поставки
    manifest: Состав поставки
    demand_hint: Сначала выберите SKU. Количество можно оставить пустым до упаковки.
      Оценки и рекомендации по дефициту справочные; количество можно менять с учётом
      остатков и вместимости. План можно сохранить без размеров коробок.
    destination_hint: Выберите кластер по операционной необходимости. Поставку можно
      оформить и в кластер без текущего дефицита.
    plan_hint: План поставки не резервирует остатки. Остатки резервируются при подтверждении
      упаковочной партии.
    suggested_units: Рекомендуется, шт.
    sales: Продажи на всех платформах, шт.
    sales_hint: "Последние 4 недели: с %{from} по %{to}, все магазины и платформы, без отменённых и возвращённых заказов. Прогноз — строгий суточный прогноз из рабочего места SKU × 28 дней; - означает отсутствие пригодных дней наблюдения."
    recent_sales: "За 4 недели: %{quantity}"
    strict_forecast_sales: "Строгий прогноз × 28 дней: %{quantity}"
    packable_units: Доступный остаток для партии, шт.
    units: Оценка количества, шт. (необязательно)
    quantity_pending: Определить при упаковке
    week: Неделя поставки (неделя выбранной даты)
    save: Сохранить план поставки
    saved: План поставки сохранён
    packaging_ready: Данные коробки заполнены
    packaging_pending: Данные коробки ожидаются; планирование доступно
    packing_plans: Упаковочные партии
    pack: 02 · Распределить по коробкам / паллетам
    edit: Изменить план поставки
    cancel: Отменить план поставки
    allocated: Всего в партиях, шт.
    remaining: Остаток по оценке, шт.
    reference_units: Ориентир поставки, шт.
    source_plan: 'План поставки: %{number}'
    packing_hint: Оценка не ограничивает упаковку. Меняйте количество с учётом остатков,
      коробок и вместимости. Рекомендуемое число коробок учитывает остаток оценки,
      а без оценки — продажи; диапазон покрытия используется для автоматического дополнения.
      Итог включает черновики и завершённые партии, исключая отменённые.
      Проверьте итог перед созданием следующей партии.
    empty: Нет планов поставок
    no_packing: Упаковочные партии ещё не созданы
    statuses:
      active: Ожидает исполнения
      cancelled: Отменён
    messages:
      saving: Сохранение плана поставки…
      failed: Ошибка сохранения. Повторите попытку.
  pallet_workbench:
    errors:
      delivery_inactive: План отменён; редактирование и распределение недоступны.
      delivery_sku_unavailable: '%{sku} отсутствует в плане поставки. Сначала добавьте SKU в план.'
      delivery_sku_in_use: '%{sku} используется в упаковочных партиях. Отмените их перед удалением SKU.'
      delivery_has_packages: Сначала отмените упаковочные партии.
