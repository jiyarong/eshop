      source_basis:
        actual_selling_price:
          scope: "口径：销售订单（订单表，不是利润归集）"
          how: "取最近 4 个整周（周一到周日，不含本周，按你的时区）这个 SKU 的订单商品：只取已绑定到本 SKU 的在售商品（店铺 + 平台 + 平台商品编号硬关联），排除取消单和数量为 0 的行，再按本场景的履约方式（FBO/FBW 或 FBS）筛选。佣金基准价取订单行的计佣价格（平台按它收佣金），买家实付价取订单行的买家实付单价，两者各自独立、按件数加权取均值；非卢布币种按订单日的汇率折成卢布。市场归属：WB 看对应统计订单的买家国家，查不到国家的订单按俄罗斯算（页面不单独显示这部分件数）；Ozon 看买家的付款币种（RUB 算俄罗斯，BYN 算白俄）。核对：在订单页面按 SKU、最近 4 周、履约方式筛出订单，排除取消单后，看每件的佣金基准价和买家实付价，按件数加权平均就能对上。"
        actual_return_rate:
          wb_scope: "口径：物流账务（WB 财务明细里的物流行；不是订单表，也不是买家主动退货率）"
          wb_how: "物流退货率 = 有返程费用的包裹数 ÷ 有去程费用的包裹数，取最近 4 个整周（按账务行日期）、本场景的履约方式（FBW / FBS）和买家国家（俄罗斯 / 白俄，国家来自对应统计订单）。去程是物流行里的「К клиенту при продаже / при отмене」，返程是「От клиента при возврате / при отмене」，同一包裹的多条行按 srid（没有就按 shk）合并后只算 1 个。取消、拒收、没取走的包裹同样要付一条去程和一条返程，所以也算在内——这正是计算器「(去程 + 返程) × 退货率 ÷ 成交签收率」需要的口径，也和利润归集里的物流成本一致。核对：在 WB 周报明细里按 SKU 筛物流行，数「К клиенту…」的包裹数和「От клиента…」的包裹数，相除即可。"
          ozon_scope: "口径：物流应计（Ozon 应计里的去程 / 返程类费用；不是订单表，也不是买家主动退货率）"
          ozon_how: "物流退货率 = 有返程费用的过账数 ÷ 有去程费用的过账数，取最近 4 个整周（按应计日期）和本场景的履约方式（过账号在 FBS 过账表里的算 FBS，其余算 FBO）。去程类应计是 type 28 / 30 / 31 / 32，返程类是 9 / 45 / 59 / 60 / 61（交接类 16 / 29 / 98 不算）；每个过账号按 SKU 合并后只算 1 个。没有送达、被取消或拒收的过账没有销售收入，但仍会产生去程和返程费，所以也算在内。核对：在 Ozon 应计明细里按 SKU 和日期筛选，数有去程费的过账数和有返程费的过账数，相除即可。"
        actual_logistics:
          wb_scope: "口径：物流账务（WB 财务明细里的物流行；BYN 折成卢布）"
          wb_how: "取最近 4 个整周（按账务行日期）、本场景履约方式和买家国家的物流行，同一包裹（srid，没有则 shk）的多条行合并成一个金额，再取平均：去程是「К клиенту при продаже / при отмене」（含取消单的去程），返程是「От клиента при возврате / при отмене」。「退回卖家」（Возврат … К продавцу）是另一套费用，单独合计后按「有买家返程的包裹数」平摊进返程均价。账务里的金额是 BYN，按当周的 BYN/RUB 汇率折算（和 WB 按日汇率有小偏差）。样本数是包裹数。核对：在 WB 周报明细里按 SKU 筛物流行，把同一包裹的行相加，去程、返程各取平均，再乘当周汇率。"
          ozon_scope: "口径：物流应计（Ozon 应计里的物流类费用，RUB）"
          ozon_how: "取最近 4 个整周（按应计日期）、本场景履约方式的过账（过账号在 FBS 过账表里的算 FBS，其余算 FBO）。去程 = 去程类应计（type 28 / 30 / 31 / 32，主要是 32）按过账合并后的平均；交接与末端处理费 = 16 / 29 / 98 三类（送取货点或分拣中心的交接费、末端快递再分配、送到交接点）之和，除以有去程费的过账数，所以是「每个送达件」的平均，而不是只在带这类费用的过账上平均；返程 = 返程类应计（9 / 45 / 59 / 60 / 61）按过账合并后的平均。样本数是过账数。核对：在 Ozon 应计明细里按 SKU、日期、过账号汇总各类型金额，对应类型相加即可。"
        actual_acquiring:
          wb_scope: "口径：销售账务（WB 财务明细里的销售行）"
          wb_how: "收单费率 = 收单费合计 ÷ 计佣基数合计，取最近 4 个整周（按账务行日期）、本场景买家国家的「销售」行：每行的收单费（acquiring_fee）对应该行的含折扣零售价 × 数量，只统计两者都大于 0 的行。基数和计算器的「收入 × 收单费率」同一口径，不是占结算额的比例。退货行不计：退货时这笔收单费已随销售一并冲回，净额为 0。核对：在 WB 周报明细里筛销售行，把「收单费」列求和，再把「含折扣零售价 × 数量」求和，相除即可。"
          ozon_scope: "口径：销售应计（Ozon 应计里的销售收入与收单费）"
          ozon_how: "收单费率 = 收单费 ÷ 销售收入，取最近 4 个整周（按应计日期）、本场景履约方式的过账：销售收入是 type 0（含退货冲回的负数），收单费是 type 1，并且只统计同一 SKU、同一过账里有销售收入的收单费。基数和佣金一样是平台计佣的销售额。核对：在 Ozon 应计明细里按 SKU 汇总 type 0 与 type 1，相除即可。"
        actual_storage:
          wb_scope: "口径：付费仓储报表 + 结算报告净销量（WB）"
          wb_how: "每件仓储费 = 仓储费合计 ÷ 净销量。仓储费取最近 4 个整周（按计费日期）该 SKU 的「付费仓储」报表金额合计；净销量取结算报告（报告结束日在窗口内）里该 SKU 的销售数量减退货数量，两种报告类型都算，和利润归集一致。仓储按 SKU 收费，与买家市场无关，所以各市场场景取到同一个值。核对：在 WB 仓储费报表里按 SKU 和日期求和，再除以该期结算报告里的净销量。"
          ozon_scope: "口径：仓储应计 + 销售应计（Ozon，仅 FBO）"
          ozon_how: "每件仓储费 = 仓储费合计 ÷ 销售过账数。仓储费取最近 4 个整周（按应计日期）仓储类应计（type 15 / 46 / 78 及 TemporaryPlacement 等，不含越库费 type 12）的合计；销售过账数是销售收入为正（type 0 大于 0）的 FBO 过账数。FBS 商品不在 Ozon 仓库，不产生也不分摊仓储费。核对：在 Ozon 应计明细里按 SKU 汇总仓储类型金额，除以有销售收入的 FBO 过账数。"
        actual_advertising:
          wb_scope: "口径：已结算广告费 + 财务明细净销售额（WB）"
          wb_how: "广告费率 = 广告费 ÷ 净销售额，按周计算再合计。广告费取 WB「已结算广告费」，按每个活动里各商品当周的实际消耗占比分摊给这个 SKU（活动缺少 SKU 消耗明细时按活动商品均分，样本说明会提示）；净销售额取同周财务明细里该 SKU 的销售额减退货额（含折扣零售价 × 数量，即佣金基准价口径），BYN 按这一周实际隐含的汇率折成卢布，缺失时用周汇率。费率大于等于 100% 时无法用于测算。核对：在 WB 广告后台看该 SKU 各活动当周消耗和结算金额，再除以当周净销售额。"
          ozon_scope: "口径：广告投放消耗 + 销售应计（Ozon Performance 报表）"
          ozon_how: "广告费率 = 广告花费 ÷ 销售额，按周计算再合计：花费取 Ozon Performance 报表里该 SKU 当周的消耗（只统计有报表的周），销售额取同周该 SKU 的销售应计（type 0）合计。样本说明里的「覆盖率」是 Performance 总花费占应计里店铺广告费的比例，用来判断报表是否完整。费率大于等于 100% 时无法用于测算。核对：在 Ozon 广告后台导出该 SKU 当周花费，再除以同周应计里的销售额。"
        official_commission:
          wb_scope: "口径：平台官方接口（WB 类目佣金表），不是订单或账务"
          wb_how: "按商品所属类目取 WB 官方类目佣金：FBS 用 kgvpMarketplace，FBW 用 paidStorageKgvp，来自最近一次同步的佣金快照（超过 45 天没更新会在日志里告警）。同一 SKU 绑定了多个商品时，只有佣金相同才会自动给出一个数，否则由你自己选。核对：在 WB 卖家后台的「类目佣金」里找该商品的类目。"
          ozon_scope: "口径：平台官方接口（Ozon 商品价格接口里的佣金），不是订单或账务"
          ozon_how: "取该商品在 Ozon 商品价格接口返回的 commissions 里对应履约方式的百分比（FBO 用 sales_percent_fbo，FBS 用 sales_percent_fbs），来自已同步的商品价格数据，会随类目和价格档变化。同一 SKU 绑定了多个商品且佣金不同时，不会自动选。核对：在 Ozon 卖家后台商品的佣金或价格计算器里看。"
        wb_logistics_tariffs:
          scope: "口径：平台官方接口（WB 官方物流费率表 Box Tariffs，月度快照）"
          how: "官方表按仓库给出基础费、每升费用和物流系数，其中基础费和每升费用已经乘过系数（例如 71.3 / 21.7 = 46 / 14 × 1.55），回填时会先除掉系数，避免重复乘。FBS 取表里的 Marketplace 字段，FBW 取 box 字段。接口只返回 CIS 仓库和「Свой склад РФ」，没有俄罗斯 FBW 仓，所以俄罗斯 FBW 没有官方档位。核对：对照 WB 官方「物流费率」页面，看对应仓库的基础费、每升费用和系数。"
        ozon_logistics_tariffs:
          scope: "口径：平台官方费率表（Ozon 物流路线费率 xlsx 快照）"
          how: "按 SKU 的体积（长 × 宽 × 高 ÷ 1000）落入的体积档，取所选路线（发货集群 → 目的集群）的费率；FBS 还会按商品佣金基准价分「300 以下 / 300 以上」两列。固定公式不让你挑路线，而是取我们订单里最常用路线（FBO 前 40 条、FBS 前 20 条）的简单平均，详见该行下面的说明。核对：对照 Ozon 后台下载的物流费率表，找对应的体积档和路线。"
        ozon_cross_dock:
          scope: "口径：供货单应计（Ozon 越库费，按供货单摊到 SKU）；平台越库费率表仅作参考"
          how: "每件越库费 = 该 SKU 在窗口内的越库费合计 ÷（带越库费的供货里该 SKU 的件数 + 窗口内直供件数）。Ozon 按供货单收一次越库费（应计 type 12），同步时按供货单里各 SKU 的件数 × 内箱体积拆分，所以不能用「费用 ÷ 当期销量」。窗口是最近 12 个整周（按费用入账日期），样本少于 20 件时扩展到全部历史；找不到供货明细的供货单不计入。核对：在 Ozon 供货单页面看该 SKU 的供货件数，在应计里按供货单号求该 SKU 的越库费。"
