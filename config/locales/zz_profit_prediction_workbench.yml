      source_basis:
        actual_selling_price:
          scope: "Основа: заказы на продажу (таблица заказов, не распределение прибыли)"
          how: "Товары в заказах этого SKU за последние 4 полные недели (с понедельника по воскресенье, текущая неделя не входит, в вашем часовом поясе): только листинги, привязанные к SKU (магазин + площадка + ID товара на площадке), без отменённых заказов и строк с нулевым количеством, затем по способу исполнения сценария (FBO/FBW или FBS). Базовая цена комиссии — цена строки заказа, с которой площадка берёт комиссию; цена покупателя — оплаченная покупателем цена за единицу; каждая усредняется отдельно, с весом по количеству, цена в другой валюте переводится в рубли по курсу на дату заказа. Рынок: для WB — страна покупателя из соответствующего статистического заказа (заказ без известной страны считается российским; страница не показывает, сколько это единиц); для Ozon — валюта оплаты покупателя (RUB — Россия, BYN — Беларусь). Проверка: на странице заказов отфильтруйте по SKU, последним 4 неделям и способу исполнения, исключите отменённые и усредните базовую цену комиссии и цену покупателя за единицу с весом по количеству."
        actual_return_rate:
          wb_scope: "Основа: логистический учёт (строки логистики в финансовых деталях WB; не таблица заказов и не доля возвратов покупателей)"
          wb_how: "Логистическая доля возвратов = отправления с обратной доставкой ÷ отправления с доставкой к покупателю за последние 4 полные недели (по дате строки отчёта), для способа исполнения сценария (FBW / FBS) и страны покупателя (Россия / Беларусь, страна берётся из статистического заказа). Прямая доставка — строка логистики «К клиенту при продаже / при отмене», обратная — «От клиента при возврате / при отмене»; несколько строк одного отправления объединяются по srid (при его отсутствии по shk) и считаются один раз. Отменённое, отклонённое или не забранное отправление тоже платит прямую и обратную доставку, поэтому тоже учитывается: именно такая основа нужна формуле калькулятора (прямая + обратная) × доля возвратов ÷ доля выкупа, она совпадает с логистическими затратами в распределении прибыли. Проверка: в деталях недельного отчёта WB отфильтруйте строки логистики по SKU, посчитайте отправления с «К клиенту…» и с «От клиента…» и разделите."
          ozon_scope: "Основа: логистические начисления (затраты на прямую / обратную доставку в начислениях Ozon; не таблица заказов и не доля возвратов покупателей)"
          ozon_how: "Логистическая доля возвратов = отправления с обратной доставкой ÷ отправления с прямой доставкой за последние 4 полные недели (по дате начисления) для способа исполнения сценария (номер отправления есть в таблице FBS — это FBS, иначе FBO). Начисления прямой доставки — type 28 / 30 / 31 / 32, обратной — 9 / 45 / 59 / 60 / 61 (типы передачи 16 / 29 / 98 не считаются); одно отправление по SKU считается один раз. Недоставленное, отменённое или отклонённое отправление не даёт выручки, но платит обе доставки, поэтому тоже учитывается. Проверка: в деталях начислений Ozon отфильтруйте по SKU и дате, посчитайте отправления с прямой и с обратной доставкой и разделите."
        actual_logistics:
          wb_scope: "Основа: логистический учёт (строки логистики в финансовых деталях WB; BYN переведены в рубли)"
          wb_how: "Строки логистики за последние 4 полные недели (по дате строки) для способа исполнения и страны покупателя сценария; строки одного отправления (srid, при его отсутствии shk) объединяются в одну сумму и усредняются: прямая доставка — «К клиенту при продаже / при отмене» (включая отменённые заказы), обратная — «От клиента при возврате / при отмене». Возврат товара продавцу (Возврат … К продавцу) — отдельная статья: её сумма распределяется на отправления с обратной доставкой от покупателя и добавляется к среднему возврату. Суммы в учёте в BYN, переводятся по курсу BYN/RUB этой недели (немного отличается от дневного курса WB). Размер выборки — число отправлений. Проверка: в деталях недельного отчёта WB отфильтруйте строки логистики по SKU, сложите строки каждого отправления, усредните прямую и обратную доставку и умножьте на курс недели."
          ozon_scope: "Основа: логистические начисления (логистические затраты в начислениях Ozon, RUB)"
          ozon_how: "Отправления за последние 4 полные недели (по дате начисления) способа исполнения сценария (номер есть в таблице FBS — FBS, иначе FBO). Прямая доставка = начисления прямой доставки (type 28 / 30 / 31 / 32, в основном 32), объединённые по отправлению и усреднённые; плата за передачу и последнюю милю = типы 16 / 29 / 98 вместе (сдача в ПВЗ или сортировочный центр, перераспределение последней мили, доставка в место передачи), делённая на число отправлений с прямой доставкой — то есть среднее на доставленную единицу, а не только по отправлениям с такой платой; обратная доставка = начисления возвратов (9 / 45 / 59 / 60 / 61), объединённые по отправлению и усреднённые. Размер выборки — число отправлений. Проверка: в деталях начислений Ozon сложите суммы каждого типа по SKU, дате и номеру отправления."
        actual_acquiring:
          wb_scope: "Основа: учёт продаж (строки продаж в финансовых деталях WB)"
          wb_how: "Ставка эквайринга = сумма эквайринга ÷ сумма базы комиссии за последние 4 полные недели (по дате строки) по строкам «продажа» для страны покупателя сценария: эквайринг строки (acquiring_fee) к розничной цене со скидкой × количество этой строки, только строки, где оба значения положительны. База та же, что в калькуляторе (выручка × ставка эквайринга), а не доля от расчётной суммы. Строки возвратов не учитываются: при возврате эквайринг сторнируется вместе с продажей, итог равен 0. Проверка: в деталях недельного отчёта WB отфильтруйте строки продаж, сложите колонку эквайринга и «розничная цена со скидкой × количество» и разделите."
          ozon_scope: "Основа: начисления по продажам (выручка и эквайринг в начислениях Ozon)"
          ozon_how: "Ставка эквайринга = эквайринг ÷ выручка за последние 4 полные недели (по дате начисления) по отправлениям способа исполнения сценария: выручка — type 0 (со сторно возвратов в виде отрицательных значений), эквайринг — type 1, и учитывается только эквайринг отправления, у которого по этому SKU есть выручка. База — сумма продаж, с которой площадка берёт комиссию, как и для комиссии. Проверка: в деталях начислений Ozon сложите type 0 и type 1 по SKU и разделите."
        actual_storage:
          wb_scope: "Основа: отчёт о платном хранении + чистые продажи по отчётам реализации (WB)"
          wb_how: "Хранение на единицу = сумма хранения ÷ чистые продажи. Хранение — суммы SKU в отчёте о платном хранении за последние 4 полные недели (по дате начисления); чистые продажи — проданные единицы минус возвращённые в отчётах реализации, закончившихся в окне, оба типа отчётов, как в распределении прибыли. Хранение начисляется по SKU независимо от рынка покупателя, поэтому сценарии всех рынков получают одно значение. Проверка: сложите суммы SKU в отчёте WB о хранении за период и разделите на чистые продажи по отчётам реализации."
          ozon_scope: "Основа: начисления за хранение + начисления по продажам (Ozon, только FBO)"
          ozon_how: "Хранение на единицу = сумма хранения ÷ число проданных отправлений. Хранение — сумма начислений типа хранения (type 15 / 46 / 78, TemporaryPlacement и т. п., без кросс-докинга type 12) за последние 4 полные недели (по дате начисления); проданные отправления — отправления FBO с положительной выручкой (type 0 больше 0). Товары FBS лежат не на складе Ozon и не создают и не делят хранение. Проверка: в деталях начислений Ozon сложите суммы типов хранения по SKU и разделите на число отправлений FBO с выручкой."
        actual_advertising:
          wb_scope: "Основа: списанные расходы на рекламу + чистые продажи по финансовым деталям (WB)"
          wb_how: "Ставка рекламы = расходы на рекламу ÷ чистые продажи, считается по неделям и затем суммируется. Расходы — списанные рекламные расходы WB, распределённые по товарам каждой кампании пропорционально фактическим расходам недели и отнесённые к этому SKU (если у кампании нет расходов по SKU, она делится поровну между товарами, это указано в примечании); чистые продажи — продажи SKU минус возвраты в финансовых деталях недели (розничная цена со скидкой × количество, то есть база комиссии), BYN переводятся по подразумеваемому курсу недели, при его отсутствии — по недельному курсу. Ставка 100% и выше не может использоваться. Проверка: в рекламном кабинете WB посмотрите расходы и списанную сумму по кампаниям SKU за неделю и разделите на чистые продажи недели."
          ozon_scope: "Основа: расходы на рекламу + начисления по продажам (отчёт Ozon Performance)"
          ozon_how: "Ставка рекламы = расходы на рекламу ÷ продажи, считается по неделям и затем суммируется: расходы — траты SKU за неделю в отчёте Ozon Performance (только недели с отчётом), продажи — начисления по продажам SKU (type 0) за ту же неделю. «Покрытие» в примечании — доля рекламных расходов магазина в начислениях, объяснённая тратами Performance, по ней видно, полон ли отчёт. Ставка 100% и выше не может использоваться. Проверка: выгрузите траты SKU за неделю из рекламного кабинета Ozon и разделите на продажи за ту же неделю в начислениях."
        official_commission:
          wb_scope: "Основа: официальный API площадки (таблица комиссий по категориям WB), не заказы и не начисления"
          wb_how: "Официальная комиссия WB по категории товара: для FBS — kgvpMarketplace, для FBW — paidStorageKgvp, из снимка комиссий последней синхронизации (о снимке старше 45 дней пишется предупреждение в журнал). Если к SKU привязано несколько товаров, одно значение предлагается автоматически только при равных комиссиях, иначе выбираете вы. Проверка: найдите категорию товара в таблице комиссий по категориям в кабинете продавца WB."
          ozon_scope: "Основа: официальный API площадки (комиссия в API цен товаров Ozon), не заказы и не начисления"
          ozon_how: "Процент для способа исполнения из commissions товара в API цен Ozon (sales_percent_fbo для FBO, sales_percent_fbs для FBS), из уже синхронизированных данных о ценах товаров; меняется с категорией и ценовым диапазоном. Если у SKU несколько товаров с разной комиссией, автоматически ничего не выбирается. Проверка: комиссия товара или калькулятор цен в кабинете продавца Ozon."
        wb_logistics_tariffs:
          scope: "Основа: официальный API площадки (официальный тариф логистики WB, Box Tariffs, ежемесячный снимок)"
          how: "Официальная таблица даёт для каждого склада базовую плату, плату за литр и коэффициент логистики; базовая плата и плата за литр уже включают коэффициент (71,3 / 21,7 = 46 / 14 × 1,55), поэтому перед подстановкой коэффициент снова убирается, чтобы не умножать дважды. Для FBS берутся поля Marketplace, для FBW — поля box. API возвращает только склады СНГ и «Свой склад РФ», российских складов FBW нет, поэтому для российского FBW официального уровня нет. Проверка: сравните со страницей официальных тарифов логистики WB: базовая плата, плата за литр и коэффициент склада."
        ozon_logistics_tariffs:
          scope: "Основа: официальная таблица тарифов площадки (тарифы Ozon на логистику по маршрутам, снимок xlsx)"
          how: "Для диапазона объёма, в который попадает объём SKU (длина × ширина × высота ÷ 1000), берётся ставка выбранного маршрута (кластер отправления → кластер доставки); для FBS есть ещё колонки «до 300 / свыше 300» по базовой цене комиссии. Фиксированная формула не даёт выбирать маршруты: она берёт простое среднее по самым загруженным маршрутам наших заказов (для FBO первые 40, для FBS первые 20), как сказано в примечании под строкой. Проверка: сравните с таблицей тарифов логистики, скачанной из кабинета Ozon: диапазон объёма и маршрут."
        ozon_cross_dock:
          scope: "Основа: начисления по поставкам (кросс-докинг Ozon, распределённый с поставки на SKU); таблица тарифов кросс-докинга площадки — только для справки"
          how: "Кросс-докинг на единицу = сумма платы за кросс-докинг SKU в окне ÷ (единицы SKU в поставках, где была плата, + единицы SKU в прямых поставках окна). Ozon берёт кросс-докинг один раз за поставку (начисление type 12), а при синхронизации делит его между SKU поставки по количеству × объёму внутренней коробки, поэтому «плата ÷ проданные за период» не подходит. Окно — последние 12 полных недель (по дате проводки платы), при менее чем 20 единицах расширяется на всю историю; поставка, состав которой не найден, не учитывается. Проверка: посмотрите единицы SKU на страницах поставок в кабинете Ozon и сложите плату за кросс-докинг SKU по номерам поставок в начислениях."
