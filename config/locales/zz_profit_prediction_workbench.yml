      source_basis:
        actual_selling_price:
          scope: "Basis: sales orders (the orders table, not the profit attribution)"
          how: "The last 4 full weeks (Monday to Sunday, this week excluded, in your time zone) of this SKU's order items: only listings bound to this SKU (store + platform + platform product id), cancelled orders and zero-quantity lines excluded, narrowed to the scenario's fulfilment (FBO/FBW or FBS). The commission base price is the order line's commission price (the price the platform charges commission on) and the buyer-paid price is the order line's buyer-paid unit price; each is averaged on its own, weighted by units, and a price in another currency is converted to roubles at the order date's rate. Market: for WB the buyer's country on the matching statistics order (an order with no known country counts as Russian; the page does not show how many units that is); for Ozon the currency the buyer paid in (RUB is Russia, BYN is Belarus). To check: filter the orders page by SKU, the last 4 weeks and fulfilment, leave out cancelled orders, and average the commission base price and the buyer-paid price per unit, weighted by units."
        actual_return_rate:
          wb_scope: "Basis: logistics ledger (the logistics rows of WB's finance details; not the orders table, and not the buyers' own return rate)"
          wb_how: "Logistics return rate = parcels billed a return leg / parcels billed an outbound leg, over the last 4 full weeks (by ledger row date), the scenario's fulfilment (FBW / FBS) and buyer country (Russia / Belarus, the country coming from the matching statistics order). The outbound leg is the logistics row «К клиенту при продаже / при отмене», the return leg «От клиента при возврате / при отмене»; several rows of one parcel are merged by srid (shk when there is none) and count once. A cancelled, refused or never collected parcel also pays an outbound and a return leg, so it counts too: that is exactly the basis the calculator's (outbound + return) × return rate ÷ delivered rate needs, and it matches the logistics cost in the profit attribution. To check: in WB's weekly report details filter the logistics rows by SKU, count the parcels with «К клиенту…» and those with «От клиента…», and divide."
          ozon_scope: "Basis: logistics accruals (the outbound / return fees in Ozon's accruals; not the orders table, and not the buyers' own return rate)"
          ozon_how: "Logistics return rate = postings billed a return leg / postings billed an outbound leg, over the last 4 full weeks (by accrual date) and the scenario's fulfilment (a posting number found in the FBS posting table is FBS, every other is FBO). Outbound accruals are type 28 / 30 / 31 / 32, return accruals 9 / 45 / 59 / 60 / 61 (the handover types 16 / 29 / 98 do not count); one posting counts once per SKU. A posting that was never delivered, was cancelled or refused has no sales revenue but still pays both legs, so it counts too. To check: in Ozon's accrual details filter by SKU and date, count the postings with an outbound fee and those with a return fee, and divide."
        actual_logistics:
          wb_scope: "Basis: logistics ledger (the logistics rows of WB's finance details; BYN converted to roubles)"
          wb_how: "The logistics rows of the last 4 full weeks (by ledger row date) for the scenario's fulfilment and buyer country; the rows of one parcel (srid, shk when there is none) are merged into one amount and then averaged: the outbound leg is «К клиенту при продаже / при отмене» (the outbound legs of cancelled orders included), the return leg «От клиента при возврате / при отмене». The goods sent back to the seller (Возврат … К продавцу) are a different fee: their total is spread over the parcels that have a buyer return leg and added to the return average. The ledger amounts are in BYN, converted at that week's BYN/RUB rate (a little off WB's daily rate). The sample count is parcels. To check: in WB's weekly report details filter the logistics rows by SKU, add up the rows of each parcel, average the outbound and the return legs, and multiply by that week's rate."
          ozon_scope: "Basis: logistics accruals (the logistics-type fees in Ozon's accruals, RUB)"
          ozon_how: "The postings of the last 4 full weeks (by accrual date) of the scenario's fulfilment (a posting number found in the FBS posting table is FBS, every other is FBO). Outbound = the outbound accruals (type 28 / 30 / 31 / 32, mostly 32), merged per posting and averaged; handover and last-mile fee = types 16 / 29 / 98 together (the drop-off at a pickup point or sorting centre, the last-mile redistribution, the delivery to the handover place), divided by the postings that have an outbound fee, so it is the average per delivered unit and not an average over only the postings that carry such a fee; return = the return accruals (9 / 45 / 59 / 60 / 61), merged per posting and averaged. The sample count is postings. To check: in Ozon's accrual details add up the amounts of each type per SKU, date and posting number."
        actual_acquiring:
          wb_scope: "Basis: sales ledger (the sale rows of WB's finance details)"
          wb_how: "Acquiring rate = total acquiring fee / total commission base, over the last 4 full weeks (by ledger row date) of the «sale» rows for the scenario's buyer country: each row's acquiring fee (acquiring_fee) against that row's retail price with discount × quantity, only rows where both are positive. The base is the same as the calculator's revenue × acquiring rate, not a share of the settlement. Return rows are left out: the acquiring fee is reversed together with the sale on a return, so the net is 0. To check: in WB's weekly report details filter the sale rows, add up the acquiring fee column and the retail price with discount × quantity, and divide."
          ozon_scope: "Basis: sales accruals (sales revenue and acquiring in Ozon's accruals)"
          ozon_how: "Acquiring rate = acquiring fee / sales revenue, over the last 4 full weeks (by accrual date) of the postings of the scenario's fulfilment: sales revenue is type 0 (return reversals included as negatives), the acquiring fee is type 1, and only the fee of a posting that has sales revenue for that SKU is counted. The base is the commission-bearing sales amount, the same as for the commission. To check: in Ozon's accrual details add up type 0 and type 1 per SKU and divide."
        actual_storage:
          wb_scope: "Basis: paid storage report + net units of the settlement reports (WB)"
          wb_how: "Storage per unit = total storage fee / net units. The storage fee is the SKU's amounts in the «paid storage» report for the last 4 full weeks (by charge date); net units are the units sold minus the units returned in the settlement reports ending in the window, both report types counted, as in the profit attribution. Storage is charged per SKU whatever the buyer's market, so every market's scenario gets the same figure. To check: add up the SKU's amounts in WB's storage report for the period and divide by the net units of the settlement reports."
          ozon_scope: "Basis: storage accruals + sales accruals (Ozon, FBO only)"
          ozon_how: "Storage per unit = total storage fee / sold postings. The storage fee is the total of the storage-type accruals (type 15 / 46 / 78 and TemporaryPlacement and the like, cross-docking type 12 excluded) of the last 4 full weeks (by accrual date); sold postings are the FBO postings with positive sales revenue (type 0 above 0). FBS goods are not in an Ozon warehouse and neither cause nor share storage. To check: in Ozon's accrual details add up the storage-type amounts per SKU and divide by the FBO postings with sales revenue."
        actual_advertising:
          wb_scope: "Basis: settled advertising fees + net sales of the finance details (WB)"
          wb_how: "Advertising rate = advertising fee / net sales, worked out per week and then added up. The advertising fee is WB's settled advertising fee, spread over the products of each campaign by their actual spend that week and given to this SKU (a campaign without a per-SKU spend breakdown is split equally over its products, and the sample note says so); net sales are the SKU's sales minus returns in that week's finance details (retail price with discount × quantity, i.e. the commission base basis), BYN converted at the rate implied that week, or the weekly rate when there is none. A rate of 100% or more cannot be used. To check: in WB's advertising cabinet look at the SKU's campaign spend and settled amount of that week, and divide by that week's net sales."
          ozon_scope: "Basis: advertising spend + sales accruals (Ozon Performance report)"
          ozon_how: "Advertising rate = advertising spend / sales, worked out per week and then added up: the spend is the SKU's spend of that week in the Ozon Performance report (only weeks that have a report), sales are the SKU's sales accruals (type 0) of the same week. The «coverage» in the sample note is the share of the store's advertising fees in the accruals that the Performance spend accounts for, a way to tell whether the report is complete. A rate of 100% or more cannot be used. To check: export the SKU's spend of that week from Ozon's advertising cabinet and divide by the same week's sales in the accruals."
        official_commission:
          wb_scope: "Basis: official platform API (WB's category commission table), not orders or accruals"
          wb_how: "WB's official category commission for the product's category: FBS uses kgvpMarketplace, FBW paidStorageKgvp, from the commission snapshot of the latest sync (a snapshot older than 45 days is warned about in the log). When the SKU has several products bound, one figure is offered automatically only if their commissions are equal; otherwise you choose. To check: look up the product's category in the category commission table of WB's seller cabinet."
          ozon_scope: "Basis: official platform API (the commission in Ozon's product price API), not orders or accruals"
          ozon_how: "The percentage for the fulfilment in the commissions of the product's entry in Ozon's product price API (sales_percent_fbo for FBO, sales_percent_fbs for FBS), from the product price data already synced; it moves with the category and the price band. When the SKU has several products with different commissions nothing is chosen automatically. To check: look at the product's commission or the price calculator in Ozon's seller cabinet."
        wb_logistics_tariffs:
          scope: "Basis: official platform API (WB's official logistics tariff, Box Tariffs, monthly snapshot)"
          how: "The official table gives a base fee, a fee per litre and a logistics coefficient per warehouse; the base fee and the per-litre fee already include the coefficient (71.3 / 21.7 = 46 / 14 × 1.55), so the coefficient is taken out again before the figures are filled in, to avoid multiplying twice. FBS uses the Marketplace fields of the table, FBW the box fields. The API returns only the CIS warehouses and «Свой склад РФ», no Russian FBW warehouse, so Russian FBW has no official tier. To check: compare with WB's official logistics tariff page: the warehouse's base fee, fee per litre and coefficient."
        ozon_logistics_tariffs:
          scope: "Basis: official platform tariff table (Ozon's logistics route tariff, xlsx snapshot)"
          how: "For the volume band the SKU's volume (length × width × height ÷ 1000) falls in, the rate of the chosen route (dispatch cluster → destination cluster); FBS also splits by the commission base price into the «under 300 / over 300» columns. The fixed formula does not let you pick routes: it takes the simple average of the busiest routes of our orders (the top 40 for FBO, the top 20 for FBS), as the note under the row says. To check: compare with the logistics tariff table downloaded from Ozon's cabinet: the volume band and the route."
        ozon_cross_dock:
          scope: "Basis: supply accruals (Ozon cross-docking, spread from the supply to the SKU); the platform's cross-docking tariff table is for reference only"
          how: "Cross-docking per unit = the SKU's cross-docking fees in the window / (the SKU's units in the supplies that carried a fee + its units in direct supplies of the window). Ozon bills cross-docking once per supply (accrual type 12) and the sync splits it over the SKUs of the supply by units × inner-box volume, so «fee / units sold in the period» does not work. The window is the last 12 full weeks (by the date the fee was booked), widened to all history when it holds fewer than 20 units; a supply whose lines cannot be found is not counted. To check: see the SKU's units on the supply pages of Ozon's cabinet, and add up the SKU's cross-docking fee per supply number in the accruals."
