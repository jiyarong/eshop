    rule_date: "Правила на %{date}"
    setup: Параметры отгрузки
    instant: Автоматический пересчёт после изменений
    platform: Платформа
    platforms:
      ozon: Ozon
      wb: Wildberries
    mode: Режим расчёта
    manual: Ручной выбор SKU
    automatic_soon: Автоматический режим (позже)
    fulfillment: Тип поставки
    skus: SKU / SPU (1–5 SKU)
    select_skus: Найти и выбрать SKU
    manifest: Список упаковки
    none_selected: 0 / 5
    quantity_hint: Оставьте ВСЕ количества пустыми для рекомендации вместимости с разделением SKU при необходимости. Заполните ВСЕ количества для укладки точной партии. Не смешивайте эти способы.
    dimensions_hint: Размеры транспортного короба в см, вес брутто в кг, количество товаров в коробе. Изменения действуют только в расчёте. Заполните отсутствующие параметры. Без объёма единицы товара укладка доступна, но часть расходов не рассчитана. Один SKU считается одним штрихкодом.
    fashion_hint: Льгота Fashion на сортировку по составу действует только с 01.10 по 31.12.2026. Отмечайте только подходящие товары; сортировка по зонам и исправление состава оплачиваются.
    sku: SKU
    recommend_placeholder: Подобрать
    missing_placeholder: Не задано
    start: Выберите выше от 1 до 5 SKU
    parameters: Ограничения приёмки и тарифы
    route_hint: Укажите текущий тариф маршрута назначения для расчёта перевозки. Без него отображаются только известные расходы.
    route_reference: Справочные тарифы маршрутов
    fbs_rate_hint: Доверительная приёмка по умолчанию 10 ₽/товар. Для самоприёмки в СЦ — 0, для специальных точек — фактический тариф.
    long_axis: длинной стороны (120 см)
    short_axis: короткой стороны (80 см)
    axis_hint: "Зоны расположены вдоль %{axis} паллеты; колонны идут в этом направлении. Размеры укладки указаны по длинной стороне × короткой стороне × вертикали."
    parameters_hint: Стандартные ограничения можно уменьшить для склада
    limits: Паллета и ограничения (120 × 80 × 14,5 см)
    tare_hint: Масса паллеты по умолчанию 25 кг — замените измеренным значением. По умолчанию без свеса. Высота с паллетой. FBO ограничивает массу груза, другие режимы — брутто.
    transport_handling: Перевозка и обработка
    storage: Оценка хранения
    storage_hint: Укажите только платные дни, без бесплатного периода. Монопаллета WB — ₽/паллета/день, остальные — ₽/л/день. Коэффициент склада можно изменить.
    fee_scope: Только перечисленные перевозка, обработка, забор, хранение и введённые фиксированные расходы. Без комиссии за продажу, доставки покупателю, штрафов и неуказанных затрат. Тарифы из документации на 14.10.2026. Укажите фактический тариф маршрута на склад/дату; с 30.10.2026 проверьте тарифы заново.
    recalculate: Пересчитать
    pending: Не рассчитано
    result_eyebrow: Результаты упаковки
    recommendation: Рекомендуемая загрузка
    shipment_plan: План отгрузки
    method: Отдельные выровненные колонны SKU, сравнение двух направлений зон и разрешённых ориентаций. Сначала охват выбранных SKU, затем объём загрузки. Эвристика устойчивых зон не гарантирует глобальный оптимум произвольной 3D-укладки.
    recommendation_badge: Рекомендованное количество
    shipment_badge: Точное количество партии
    total_pallets: Нужно паллет
    pallet_unit: паллет
    sku_count: "%{count} SKU"
    total_boxes: Загружено коробов
    unit_count: "%{count} единиц товара"
    total_weight: Общая масса брутто
    includes_tare: С учётом массы паллет
    estimated_fee: Оценка расходов
    known_subtotal: Известные расходы
    fee_estimate: Оценка в российских рублях
    fee_incomplete: Неполная оценка, не итоговая сумма
    missing_fees: "Неполная стоимость: укажите %{fields}. Количество рассчитано; известные расходы — только промежуточная сумма."
    mono_short: "Есть монопаллеты WB ниже минимальных 50 см. Увеличьте количество или измените тип поставки и пересчитайте. Паллеты менее 1 м³ могут тарифицироваться как короба."
    sku_results: Количество и стоимость по SKU
    boxes: Коробов
    units: Единиц товара
    carton: Размеры короба / брутто
    allocated_fee: Распределённые расходы
    allocation_hint: Обработка относится непосредственно к SKU; общие расходы распределяются по объёму товаров. При его отсутствии временно используется объём внешних коробов. * означает неполную промежуточную сумму.
    visualization: Схема укладки
    current_pallet: Показать паллету
    pallet_option: "Паллета %{number} · %{boxes} коробов"
    pallet_height: "Высота с паллетой %{value} / %{limit} см"
    pallet_weight: "Брутто %{value} кг"
    carton_volume: "Объём коробов %{value} л"
    pallet_cost: "Стоимость паллеты %{value}"
    isometric: Объёмная схема
    top_view: Нижний слой, вид сверху
    top_hint: Цвета обозначают SKU. Укладывайте снизу вверх в каждой зоне, сохраняя выравнивание колонн.
    box_count: "%{count} коробов"
    orientation: Ориентация короба
    layer_grid: Колонны × ряды в слое
    layers: Слоёв
    last_layer: Коробов в верхнем слое
    fee_detail: Расшифровка стоимости паллеты и формулы
    goods_volume: Объём товаров
    bill_volume: Расчётный объём перевозки (мин. 1900 л)
    diagram_hint: Схема показывает зоны и ориентацию, не более 400 коробов на зону. Следуйте таблице количества. Геометрия не оценивает прочность тары, хрупкость или центр тяжести. Проверьте пробную укладку и фиксацию; при необходимости уменьшите высоту.
    diagram_label: "Схема паллеты %{number}"
    diagram_height: "Высота с паллетой %{value} см"
    handoff: Инструкция упаковки для склада
    copy: Копировать инструкцию
    copied: Инструкция скопирована
    empty_title: Превратите список товаров в план укладки
    empty_description: Выберите SKU, чтобы загрузить параметры коробов, увидеть схемы и расходы и скопировать инструкцию складу.
    gross_weight: масса брутто с паллетой
    cargo_weight: масса груза
    profiles:
      ozon_fbo: Ozon FBO · склад / СЦ / кросс-докинг
      ozon_fbs: Ozon FBS · сортируемая доверительная приёмка
      wb_mono: Wildberries FBW · монопаллета
      wb_piece: Wildberries FBW · поштучная паллета
    rules:
      ozon_fbo: EUR-паллета 120 × 80 × 14,5 см; общая высота ≤220 см, груз ≤800 кг, свес ≤2 см с каждой стороны. Склад/СЦ или забор курьером; поставка коробами в ПВЗ/ППЗ вне этого режима.
      ozon_fbs: Стандартная паллета 120 × 80 × 14,5 см; общая высота ≤240 см, брутто ≤600 кг, короб ≤35 кг, свес ≤2 см. Только сортируемые товары; несортируемые отдельно.
      wb_mono: Деревянная европаллета 120 × 80 × 14,5 см; для СЦ общая высота 50–180 см, брутто ≤500 кг, до 3 штрихкодов. Разделяйте штрихкоды вертикальным картоном по узкой стороне. Проверьте ограничения размеров единицы товара для категории.
      wb_piece: Деревянная европаллета 120 × 80 × 14,5 см; для СЦ общая высота ≤180 см, брутто ≤500 кг, короб ≤25 кг, до 3 штрихкодов. Товары в транспортных коробах; паллеты не штабелировать.
    fields:
      length: Длина короба, см
      width: Ширина короба, см
      height: Высота, см
      weight: Масса, кг
      pcs: Штук в коробе
      unit_volume_l: Объём товара, л
      quantity: Коробов к отгрузке
      rotatable: Разрешить кантование
      fashion: Льгота Fashion
      overhang: Свес с каждой стороны, см
      tare: Масса паллеты, кг
      route_rate: Тариф маршрута, ₽/л
      discount: Скидка маршрута, %
      fixed_fee: Фиксированные расходы партии, ₽
      handling_rate: Обработка FBS, ₽/товар
      sorting: Тип сортировки FBO
      pickup: Забор Ozon (1,55 ₽/л; выезд отдельно)
      storage_days: Платных дней хранения
      storage_rate: Базовый тариф хранения (единицы выше)
      coefficient: Коэффициент хранения
    sorting:
      composition: Одна зона, верный состав (смешанные SKU)
      zones: Сортировка по зонам
      correction: Исправление состава
    orientations:
      upright: Вертикально (исходный верх сверху)
      sideways: На боку (исходная ширина вертикальна)
      vertical: На торце (исходная длина вертикальна)
    fees:
      route: Перевозка по маршруту
      handling: Приёмка / обработка
      pickup: Обработка при заборе
      storage: Хранение
      fixed: Фиксированная плата партии (только первая паллета)
    formulas:
      ozon_fbo: "Перевозка = max(объём товаров с округлением вверх, 1900) × тариф × (1 − скидка). Обработка забора = округлённый объём × 1,55. Фиксированные расходы однократно. Сортировка по количеству и объёму единиц товаров, не коробов; один SKU с верным составом без платы за сортировку по составу."
      ozon_fbs: "Обработка = единицы товара × тариф за единицу. Фиксированные расходы однократно. Для самоприёмки в СЦ укажите 0, для специальных точек — тариф портала."
      wb_mono: "Сейчас приёмка в СЦ/ПФЦ бесплатна. Хранение = паллеты × тариф за паллету/день × коэффициент × платные дни. Фиксированные расходы однократно."
      wb_piece: "Сейчас приёмка в СЦ/ПФЦ бесплатна. Хранение = литры товаров × тариф за л/день × коэффициент × платные дни. Фиксированные расходы однократно."
    missing:
      goods_volume: объём единицы товара
      route_rate: тариф маршрута назначения
    messages:
      changed: Параметры изменены, подготовка пересчёта…
      sku_count: Выберите от 1 до 5 SKU. SPU учитывается по входящим SKU.
      complete_fields: Заполните корректные размеры, массу и количество товаров в коробе; проверьте дополнительные ограничения.
      calculating: Сравнение укладок и расчёт стоимости…
      updated: Пересчитано по текущим параметрам. Стоимость ориентировочная.
      invalid: Исправьте параметры по подсказке ниже.
      request_error: Ошибка расчёта. Проверьте соединение и повторите.
    errors:
      profile: Выберите поддерживаемый тип поставки.
      sku_count: Выберите от 1 до 5 SKU.
      duplicate_skus: Выбирайте каждый SKU только один раз.
      sku_unavailable: SKU не найден или недоступен пользователю.
      setting: "Укажите корректное значение: %{field}."
      rule_limit: "%{field} не должно превышать %{limit} для этого типа поставки."
      item_field: "%{sku}: некорректное значение %{field}. Нужны положительные числа, размеры ≥1 см, целые количества коробов и товаров."
      does_not_fit: "%{sku} не помещается. Проверьте размеры, ориентацию и ограничения массы."
      box_weight: "%{sku} превышает ограничение короба %{limit} кг. Измените упаковку."
      mixed_quantities: Оставьте все количества пустыми для рекомендации или заполните все для точной партии.
      too_many_pallets: "Более %{count} паллет. Разделите партию."
    strategy:
      origin: Начало координат в левом верхнем углу паллеты (0,0); X вдоль стороны 120 см, Y вдоль 80 см, единицы — см. Каждую зону штабелируйте отдельно, заполняйте участки по порядку, в верхнем слое только указанный остаток.
      grid: "    Участок %{number}: начало X=%{x}, Y=%{y}; основание короба %{length} см по X и %{width} см по Y; %{columns} колонн по X × %{rows} рядов по Y."
      heading: "%{profile} | %{pallets} паллет, %{boxes} коробов, %{units} единиц товара."
      limits: "Стандартные паллеты 120×80×14,5 см, расчётная масса %{tare} кг. Общая высота ≤%{height} см; %{basis} ≤%{weight} кг; свес ≤%{overhang} см с каждой стороны."
      pallet: "Паллета %{number}: %{boxes} коробов; общая высота %{height} см, брутто %{weight} кг."
      loose_box_sku: "%{sku}: %{boxes} коробов отправляются отдельными коробами."
      zone: "  Зона %{number} / %{sku}: %{boxes} коробов (%{units} товаров); %{orientation}, размеры %{dimensions} см; схема %{grid}, до %{per_layer} коробов в слое, %{layers} слоёв, сверху %{last_layer} коробов. Плюс объединяет области слоя, косая черта разделяет размеры после поворота в плоскости. Выровняйте колонны, остаток сверху."
      ozon_fbo: EUR-паллеты; минимум 3 слоя стрейч-плёнки с захватом основания и верха в «шапку», лента крест-накрест. Одна поставка на паллете, SKU колоннами. Этикетки грузомест по порталу; для транспортного грузоместа также этикетки на коробах. Кросс-докинг собрать заранее на складе продавца; паллеты не возвращаются. Проверьте вместимость точки и допуск к лимитам 30 коробов/40 паллет либо 1500 коробов транспортных грузомест.
      ozon_fbs: Минимум 3 целых слоя плёнки, товар нельзя извлечь без её повреждения. Этикетки паллеты с трёх сторон. Сортируемые и несортируемые товары отдельно; проверьте OZN-этикетки, короб ≤35 кг. Уточните вместимость точки, право на доверительную приёмку и расходы забора.
      wb_mono: До 3 штрихкодов на паллете, один штрихкод в коробе и одинаковое количество для одного штрихкода. Вертикальный видимый картон по стороне 80 см между штрихкодами. На узкой стороне штрихкод паллеты и лист А4 (номер/всего паллет, номер поставки, короба, точка, тип поставки, юрлицо, дата). Прозрачная плёнка ≥0,15 мм, зазор до края кузова ≥10 см.
      wb_piece: Товары в транспортных коробах. До 3 штрихкодов на паллете, один штрихкод в коробе, одинаковое количество для одного штрихкода. Этикетка паллеты; не штабелировать. Для транзита упаковочный лист с количеством паллет. Прозрачная плёнка ≥0,15 мм, зазор до края кузова ≥10 см.
      check: Перед отгрузкой проверьте тарифы склада/даты в портале, штрихкоды, размеры и допуск категории, состав поставки и фактическое количество. Несовместимые товары, опасные категории и разные поставки отдельно. Геометрия не подтверждает прочность тары; выполните пробную укладку, тяжёлое вниз, груз надёжно закрепить.
      preview: Следуйте виду сверху и таблице ориентаций каждой паллеты. Не меняйте ориентацию и не ставьте разные SKU друг на друга между зонами.
