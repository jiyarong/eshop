zh:
  own_warehouse:
    page_title: 白俄自有仓成本
    page_subtitle: 维护自有仓成本版本，并按自然周查看 SKU 分摊结果。
    tabs:
      aria_label: 自有仓成本页面
      config: 成本配置
      allocations: 周度分摊
    costs_title: 自有仓成本配置
    allocations_title: 自有仓周成本分摊
    configuration_hint: 新建版本默认按 9300 元 / 7 天计费，仓储 40%、运输 25%、人工 35%、FBO 人工权重 10%。规则持续有效，无需每周新建；费用或分摊规则变化时再新建版本。
    allocation_hint: 按上海时区周一至周日归集。每周各 SKU 的费用按全仓分母计算；筛选只影响展示。无出库时每件成本为空。
    import_hint: "CSV 用于人工补齐历史数据，系统自动生成无需上传文件。下载模板会带出合规 SKU 的每日输入，异常送仓记录忽略。上传文件仍须包含全部有效 SKU 的 7 天完整数据，使用 UTF-8 编码，最多 5 MB。"
    complete_population: 确认文件包含该自有仓全部 SKU 的完整周数据
    version: 配置版本
