      configuration_subtitle: 维护白俄自有仓生效区间的总成本和分摊规则，确认后版本只读。
      allocations_subtitle: 按自然周查看每个 SKU 的自有仓成本分摊、出库单价和计算依据。
      sections:
        identity: 版本信息
        expense: 费用口径
        allocation: 分摊规则
        reference: 来源与备注
      ratios_hint: 仓储、运输和人工比例合计必须为 1；FBO 人工权重只影响人工池。
      validity_hint: 结束日期留空表示持续有效。新版本生效当天使用新规则，旧版本自动截止到前一天。
      cost_basis_hint: 每日费用 = 基准运营费用 ÷ 费用对应天数。例如 9300 元 / 7 天，每个完整自然周分摊 9300 元；有效期长短不改变每日费用。
      total_cost: 自有仓成本合计
      record_count: 分摊记录数
      details_title: SKU 分摊明细
      dynamic_rates_title: 本周动态单价
