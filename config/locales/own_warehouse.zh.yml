      fbo_unit_cost: 单件 FBO 成本（CNY）
    errors:
      no_eligible_inputs: "本周没有具备完整 7 天库存和正体积的 SKU，无法分摊。请补齐数据或选择其他已结束的自然周。"
      system_incomplete: "系统数据不完整，无法发布周分摊。"
      unsupported_warehouse: "当前系统快照只有合并自有仓口径，自动归集仅支持 BY。其他仓请导入独立完整数据。"
      ratios: 三个分摊比例必须合计为 1。
      dates: 结束日期不能早于生效日期。
      immutable: 已确认的版本不能修改或删除。
      immutable_history: 新配置的生效日期覆盖了已计算周，请选择已计算周之后的日期。
      overlap: 新版本须晚于当前已确认版本，且生效区间不得重叠。
      missing_version: "所选周没有覆盖全部 7 天的已确认成本配置。请在“成本配置”中保存并确认覆盖该周的版本。"
      invalid_week: 请选择单个已结束的完整自然周（周一至周日），再查看或生成分摊。
      missing_inputs: 请提供完整数据并确认包含全仓所有 SKU。
      invalid_inputs: 数据格式错误：日期、SKU、每件体积、库存及出库数量必须完整且合法，体积须大于零，数量不能为负。
      duplicate_inputs: 同一 SKU 同一天存在重复数据。
      incomplete_inputs: 每个 SKU 都必须包含该周全部 7 天的数据。
      missing_skus: 导入文件没有覆盖全部有效 SKU，请使用全量模板并补齐所有 SKU。
      unknown_sku: 文件包含未登记的 SKU，请先建立 SKU。
      zero_denominator: 存在有费用但分母为零的费用池，无法分摊；请检查库存及出库数据。
    statuses:
      draft: 草稿
      confirmed: 已确认
      superseded: 历史版本
