    input_warning: "本周计算已排除异常数据：%{details}。异常 SKU 不参与本周分摊，请运营人员补齐后在下一周生效。"
    immutable_hint: 已确认版本只读；修改费用或规则请新建版本。
    show_history: 显示历史周版本
    query: 查询
    total: 所选版本合计 %{amount} CNY · %{count} 条记录
