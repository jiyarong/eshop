# The standard pricing scenarios of a SKU (platform x target market x tax regime x fulfilment).
# The workbench opens every version with all of them; a SKU can hide the ones it does not sell
# (see Ec::SkuScenarioVisibility). Order here is the display order.
#
# actuals_pending (a list of "storage" / "advertising"): an actual-data kind that is still platform-wide
# for a scenario. None now: storage and advertising have no country dimension at either platform, so
# every market takes the SKU's own per-unit storage and advertising rate (decided 2026-10-20). A kind
# listed here gets a note next to its shortcut and is left alone by the monthly refresh.
#
# delivery_mode: WB FBW is stored as "fbo"; Ozon has fbo and fbs.
# To add a market or a tax regime, add its rows here and teach the calculator and the defaults
# in Ec::SkuProfitCalculator about it; nothing else enumerates the scenarios.
scenarios:
  - { platform: wb,   market: ru, delivery_mode: fbo, company_type: general }
  - { platform: wb,   market: ru, delivery_mode: fbs, company_type: general }
  - { platform: wb,   market: ru, delivery_mode: fbo, company_type: small }
  - { platform: wb,   market: ru, delivery_mode: fbs, company_type: small }
  - { platform: wb,   market: by, delivery_mode: fbo, company_type: general }
  - { platform: wb,   market: by, delivery_mode: fbs, company_type: general }
  - { platform: wb,   market: by, delivery_mode: fbo, company_type: small }
  - { platform: wb,   market: by, delivery_mode: fbs, company_type: small }
  - { platform: ozon, market: ru, delivery_mode: fbo, company_type: general }
  - { platform: ozon, market: ru, delivery_mode: fbs, company_type: general }
  - { platform: ozon, market: by, delivery_mode: fbo, company_type: general }
  - { platform: ozon, market: by, delivery_mode: fbs, company_type: general }
